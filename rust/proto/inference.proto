syntax = "proto3";
package vllm;

import "google/protobuf/struct.proto";


service Inference {
  // Generates text given a prompt
  rpc Generate (GenerateRequest) returns (GenerateResponse) {}
  // Generates text given a prompt, streaming the outputs
  rpc GenerateStream (GenerateRequest) returns (stream GenerateResponse) {}
  // Generates tokens for an already tokenized and lowered request, streaming
  // the outputs. For frontends that run their own text layer in front of this
  // server; see `GenerateTokensRequest`.
  rpc GenerateTokens (GenerateTokensRequest) returns (stream GenerateTokensResponse) {}
}

// ======================================================================================
// Generate Request
// ======================================================================================

message GenerateRequest {
  string request_id = 1;
  string model = 2;

  oneof prompt {
    string text = 3;
    TokenIds token_ids = 4;
  }

  // Temperature, defaults to model-specific default or 0
  optional float temperature = 5;
  // Parameters controlling random sampling, not applicable if temperature == 0
  RandomSampling sampling = 6;
  // Parameters for conditionally penalizing/boosting
  // candidate tokens during decoding
  DecodingParameters decoding = 7;
  // Parameters controlling when generation should stop
  StoppingCriteria stopping = 8;
  // Flags to control what is returned in the response
  ResponseOptions response = 9;
  // Parameters controlling KV cache/distribution
  KVCacheParameters kv = 10;

  // Truncate prompt tokens; default (0) means no truncation
  uint32 truncate_prompt_tokens = 11;

  int32 priority = 12;

  optional string session_id = 13;

  // Multimodal inputs aligned with placeholder markers in token_ids.
  repeated MediaItem media = 14;

  // Loaded LoRA name; empty selects the base model.
  string lora_name = 15;

  // Apply the engine's configured watermark. Defaults to true when omitted.
  optional bool watermarking = 16;

  KVHintsEnvelope kv_hints = 17;

  // Transitional, to be deprecated: only consulted when the engine runs its own
  // reasoning parser and the structured-output constraint covers only the
  // output after reasoning. Prefer a constraint that covers the full output
  // from the first generated token.
  EngineReasoningGate engine_reasoning_gate = 18;
}

// Inputs to the engine's reasoning gate, which keeps a structured-output
// constraint inactive until the engine's reasoning parser detects the end of
// reasoning.
message EngineReasoningGate {
  // Omitted: the engine infers the initial state from the prompt.
  // true: apply the constraint from the first generated token.
  // false: generation starts inside reasoning.
  optional bool reasoning_ended = 1;
  // Chat template kwargs used to render the prompt, so the engine's reasoning
  // parser observes the same thinking mode.
  google.protobuf.Struct chat_template_kwargs = 2;
}

message KVHintsEnvelope {
  string protocol_version = 1;
  string message_id = 2;
  repeated KVHintAction actions = 3;
}

message KVHintAction {
  string action_id = 1;
  string action_type = 2;
  string action_version = 3;
  google.protobuf.Struct payload = 4;
}

message RandomSampling {
  uint32 num_sequences = 1;  // "n", default (0) means 1
  optional uint32 top_k = 2;  // Omitted means default; 0 disables top-k.
  optional float top_p = 3;  // Omitted means default; must be in (0, 1].
  optional float min_p = 4;  // Omitted means default; 0 disables min-p.
  optional int64 seed = 5;
}

message DecodingParameters {
  // Penalties
  float presence_penalty = 1;  // Default (0.0) means no penalty
  float frequency_penalty = 2;  // Default (0.0) means no penalty
  float repetition_penalty = 3;  // Default (0.0) means no penalty
  map<uint32, float> logit_bias = 4;
  repeated uint32 allowed_token_ids = 5;

  message StringChoices {
    repeated string choices = 1;
  }

  // Control structured outputs
  oneof structured_output {
    string json = 6;
    string regex = 7;
    StringChoices choice = 8;
    string grammar = 9;
    bool json_object = 10;
    string structural_tag = 11;
  }

  // Token sequences that must not be generated. Each sequence must be nonempty.
  repeated TokenIds bad_words_token_ids = 12;
}

message StoppingCriteria {
  // Default (0) is currently 20
  uint32 max_new_tokens = 1;
  // Default (0) means no minimum
  uint32 min_new_tokens = 2;

  repeated uint32 stop_token_ids = 3;
  repeated string stop_strings = 4;
  bool include_stop_strings = 5;

  bool ignore_eos = 6;

  // Omitted or -1 disables the budget; zero immediately closes reasoning.
  optional int64 thinking_token_budget = 7;
}

message ResponseOptions {
  // Prompt options
  bool prompt_token_ids = 1;
  bool prompt_logprobs = 2;
  optional CandidateTokens prompt_candidates = 3;

  // Output options; output_text defaults to true
  optional bool output_text = 4;
  bool output_token_ids = 5;
  bool output_logprobs = 6;
  optional CandidateTokens output_candidates = 7;
  // Defaults to true when omitted.
  optional bool skip_special_tokens = 8;
}

message KVCacheParameters {
  bool bypass_prefix_cache = 1;
  string cache_salt = 2;

  // KV Connector transfer parameters
  google.protobuf.Struct kv_transfer_params = 3;

  // Encoder cache connector transfer parameters
  google.protobuf.Struct ec_transfer_params = 4;
}

// Controls which extra candidate tokens at each position should be returned
message CandidateTokens {
  oneof select {
    uint32 top_n = 1;
    TokenIds token_ids = 2;
    bool all = 3;
  }
}

// ======================================================================================
// Generate Response
// ======================================================================================

message GenerateResponse {
  // Only present in first response
  optional PromptInfo prompt_info = 1;
  SequenceOutput outputs = 2;
}

message SequenceOutput {
  // Index of output sequence for num_sequences > 1.
  uint32 index = 1;

  string text = 2;
  uint32 num_tokens = 3;  // Number of tokens in this chunk
  repeated uint32 token_ids = 4;  // If requested
  repeated float logprobs = 5;  // If requested
  repeated uint32 ranks = 6;  // If logprobs were requested
  repeated CandidateTokenInfo candidate_tokens = 7; // If requested

  // Only present in final output for this sequence
  optional FinishInfo finish_info = 8;
  // Only present in final output when sampling-mask capture is enabled.
  repeated TokenIds sampling_mask = 10;
}

// Prompt info, returned in the first response
message PromptInfo {
  uint32 num_prompt_tokens = 1;
  repeated uint32 token_ids = 2;  // If requested
  repeated float logprobs = 3;  // If requested
  repeated uint32 ranks = 4;  // If logprobs were requested
  repeated CandidateTokenInfo candidate_tokens = 5;
}

// Finish info, returned in the final response
message FinishInfo {
  uint32 num_output_tokens = 1;

  enum FinishReason {
    NOT_FINISHED = 0;  // Possibly more tokens to be streamed
    LENGTH = 1;  // Finished due to length constraint
    STOP = 2;  // Stop string/token or EOS encountered
    ABORTED = 3;  // Request aborted/cancelled
  }

  FinishReason finish_reason = 2;
  // One of these will be set when finish_reason == STOP
  oneof stop_reason {
    uint32 stop_token_id = 3;
    uint32 eos_token_id = 4;
    string stop_string = 5;
  }

  google.protobuf.Struct kv_transfer_params = 6;
  //uint64 seed = 7;
  google.protobuf.Struct ec_transfer_params = 8;
  optional uint32 num_cached_tokens = 9;
}

// Info for candidate tokens other than the input/sampled
// token at a given position
message CandidateTokenInfo {
  message TokenInfo {
    uint32 id = 1;
    float logprob = 2;
    uint32 rank = 3;
    //    string text = 4;
    //    bytes token_bytes = 5;
  }
  // Candidate token infos at this position
  repeated TokenInfo tokens = 1;
}

// Token ids used for prompt
message TokenIds {
  repeated uint32 ids = 1;
}

// ======================================================================================
// Media
// ======================================================================================

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_IMAGE = 1;
  MODALITY_VIDEO = 2;
  MODALITY_AUDIO = 3;
}

message MediaItem {
  Modality modality = 1;
  oneof source {
    string url = 2;       // http:// or https://
    string data_uri = 3;  // data:
    bytes raw_bytes = 4;
    PreprocessedMediaFeatures features = 7;
  }
  string mime_type = 5;
  string uuid = 6;
}

// Engine-ready multimodal features produced by a version-compatible frontend.
// `kwargs` is the MessagePack wire representation of one MmKwargsItem.
message PreprocessedMediaFeatures {
  // Required inline payload. Cache-only references are not accepted.
  optional bytes kwargs = 1;
  string identifier = 2;
  uint64 offset = 3;
  uint64 length = 4;
  optional string mm_hash = 5;
  repeated bool is_embed = 6;
}

// ======================================================================================
// Generate Tokens
// ======================================================================================

// A request at the server's engine boundary: prompt tokens plus sampling
// parameters that the caller's text layer has already resolved, including
// model defaults and the stop and EOS token IDs. The server applies no
// defaults, does not detokenize, and leaves stop strings to the caller, so the
// caller must load the same model and run the same vLLM revision
// (`ServerInfo.proto_version`).
message GenerateTokensRequest {
  // External request ID; aborts and outputs refer to it.
  string request_id = 1;
  repeated uint32 prompt_token_ids = 2;
  EngineSamplingParams sampling_params = 3;
  // Unix timestamp, in seconds, when the request arrived at the caller.
  optional double arrival_time = 4;
  optional string cache_salt = 5;
  // Tracing headers forwarded to the engine; absent when not traced.
  TraceHeaders trace_headers = 6;
  int32 priority = 7;
  optional uint32 data_parallel_rank = 8;
  optional string session_id = 9;
  KVHintsEnvelope kv_hints = 10;
  EngineReasoningGate reasoning_gate = 11;
  // TODO: multimodal features and LoRA adapters.
}

message TraceHeaders {
  map<string, string> headers = 1;
}

// Engine sampling parameters, as resolved by the caller's text layer. Every
// field is explicit; a message-typed field is absent when unset.
message EngineSamplingParams {
  float temperature = 1;
  bool watermarking = 2;
  float top_p = 3;
  uint32 top_k = 4;
  optional int64 seed = 5;
  uint32 max_tokens = 6;
  uint32 min_tokens = 7;
  optional uint64 thinking_token_budget = 8;
  optional int32 logprobs = 9;
  optional int32 prompt_logprobs = 10;
  optional uint32 prompt_logprob_start = 11;
  float min_p = 12;
  float frequency_penalty = 13;
  float presence_penalty = 14;
  float repetition_penalty = 15;
  RepetitionDetection repetition_detection = 16;
  repeated uint32 stop_token_ids = 17;
  optional uint32 eos_token_id = 18;
  // Stop token IDs plus the EOS and generation-config stop tokens.
  repeated uint32 all_stop_token_ids = 19;
  LogitBias logit_bias = 20;
  TokenIds allowed_token_ids = 21;
  TokenIdSequences bad_words_token_ids = 22;
  EngineStructuredOutputs structured_outputs = 23;
  TokenIds logprob_token_ids = 24;
  optional bool skip_reading_prefix_cache = 25;
  // Extra arguments, such as `kv_transfer_params`, forwarded to the engine.
  google.protobuf.Struct extra_args = 26;
  uint32 routed_experts_prompt_start = 27;
  // Minimum number of tokens per streamed output after the first; absent or 1
  // streams every step.
  optional uint32 stream_interval = 28;
  // TODO: prompt_logprob_token_ids.
}

message RepetitionDetection {
  uint32 max_pattern_size = 1;
  uint32 min_pattern_size = 2;
  uint32 min_count = 3;
}

message LogitBias {
  map<uint32, float> bias = 1;
}

message TokenIdSequences {
  repeated TokenIds sequences = 1;
}

message EngineStructuredOutputs {
  oneof constraint {
    // JSON text of the schema, which is itself a JSON object or string.
    string json = 1;
    string regex = 2;
    DecodingParameters.StringChoices choice = 3;
    string grammar = 4;
    bool json_object = 5;
    string structural_tag = 6;
  }
  bool disable_any_whitespace = 7;
  bool disable_additional_properties = 8;
  optional string whitespace_pattern = 9;

  enum Backend {
    BACKEND_XGRAMMAR = 0;
    BACKEND_GUIDANCE = 1;
    BACKEND_OUTLINES = 2;
    BACKEND_LM_FORMAT_ENFORCER = 3;
  }
  Backend backend = 10;
}

message GenerateTokensResponse {
  // Only present in the first response.
  TokenPromptInfo prompt_info = 1;
  // The engine's internal request ID; only present in the first response.
  string engine_request_id = 12;
  // Tokens generated since the previous response.
  repeated uint32 token_ids = 2;
  // Sample logprobs for `token_ids`, when requested.
  TokenLogprobs logprobs = 3;
  // Only present in the final response.
  TokenFinish finish = 4;
  // Prompt tokens served from cache, once prefill stats arrive.
  uint64 num_cached_tokens = 5;
  google.protobuf.Struct kv_transfer_params = 6;
  google.protobuf.Struct ec_transfer_params = 7;
  // Sampling support sets aligned with `token_ids`, when captured.
  TokenIdSequences sampling_mask = 8;
  // The fields below are only present in the final response.
  SpecDecodeMetrics spec_decode_metrics = 9;
  WeightVersions weight_versions = 10;
  // Engine lifecycle timestamps after this response.
  EngineTimestamps timestamps = 11;
  // TODO: prompt_token_id_logprobs and routed_experts.
}

message TokenPromptInfo {
  repeated uint32 prompt_token_ids = 1;
  TokenLogprobs prompt_logprobs = 2;
}

// Logprobs per scored position: the scored token first, then the requested
// candidates.
message TokenLogprobs {
  message Position {
    repeated uint32 token_ids = 1;
    repeated float logprobs = 2;
    repeated uint32 ranks = 3;
  }
  repeated Position positions = 1;
}

message TokenFinish {
  enum Reason {
    REASON_STOP = 0;
    REASON_LENGTH = 1;
    REASON_ABORT = 2;
    REASON_ERROR = 3;
    REASON_REPETITION = 4;
  }
  Reason reason = 1;
  // Set for STOP and REPETITION when an explicit stop token or string matched.
  oneof stop_reason {
    uint32 stop_token_id = 2;
    string stop_string = 3;
  }
  // The engine's details for ERROR, when it sent any.
  RequestError error = 4;
}

message RequestError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message SpecDecodeMetrics {
  uint64 num_spec_tokens = 1;
  repeated uint64 histogram = 2;
  uint64 num_draft_tokens = 3;
  repeated uint64 per_step_accepted = 4;
  repeated uint64 per_step_drafted = 5;
}

message WeightVersions {
  message Span {
    string version = 1;
    uint64 start = 2;
    uint64 end = 3;
  }
  repeated Span spans = 1;
}

message EngineTimestamps {
  double queued = 1;
  double scheduled = 2;
  double first_token = 3;
  double last_token = 4;
}
